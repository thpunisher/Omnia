<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omnia</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0f0f0f;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }

      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        animation: fadeIn 0.4s ease-out;
      }

      .mark {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #5E6AD2;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 12px 32px rgba(94,106,210,0.35);
        animation: pulse 1.8s ease-in-out infinite;
      }
      .mark span {
        font-size: 26px;
        font-weight: 900;
        color: #fff;
        letter-spacing: -0.02em;
      }

      .label {
        font-size: 13px;
        font-weight: 500;
        color: #5a5a5a;
        letter-spacing: 0.02em;
      }

      .dots {
        display: flex;
        gap: 5px;
      }
      .dots span {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #3a3a3a;
        animation: dot 1.2s ease-in-out infinite;
      }
      .dots span:nth-child(2) { animation-delay: 0.15s; }
      .dots span:nth-child(3) { animation-delay: 0.3s; }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 12px 32px rgba(94,106,210,0.35); }
        50%      { transform: scale(1.06); box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 16px 40px rgba(94,106,210,0.5); }
      }
      @keyframes dot {
        0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
        30%           { opacity: 1; transform: translateY(-2px); }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark"><span>O</span></div>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
  </body>
</html>
